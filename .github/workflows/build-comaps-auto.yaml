name: Build CoMaps Auto
on:
  push:
    branches: [ "comaps-auto-v2" ]
  workflow_dispatch:

concurrency:
  group: comaps-auto-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
  SKIP_MAP_DOWNLOAD: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build tools and dependencies
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev qt6-positioning-dev libqt6svg6-dev optipng libfreetype-dev libharfbuzz-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev python3-pip zlib1g-dev
          pip install "protobuf<3.21" --break-system-packages

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Parallel submodules checkout
        shell: bash
        run: git submodule update --depth 1 --init --recursive --jobs=$(($(nproc) * 20))

      - name: Prepare Dynamic Version Info
        working-directory: ./android
        run: |
          VERSION_DATE=$(date -u +%Y.%m.%d)
          VERSION_DATE_CODE=$(date -u +%y%m%d)
          VERSION_CODE=$((10#$VERSION_DATE_CODE * 1000 + GITHUB_RUN_NUMBER % 1000))
          VERSION_NAME_64="${VERSION_DATE}.${GITHUB_RUN_NUMBER}"
          VERSION_NAME_32="${VERSION_DATE}.${GITHUB_RUN_NUMBER}-32bit"
          
          echo "VERSION_NAME_64=${VERSION_NAME_64}" >> $GITHUB_ENV
          echo "VERSION_NAME_32=${VERSION_NAME_32}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          
          echo "{\"versionCode\": ${VERSION_CODE}, \"versionName\": \"${VERSION_NAME_64}\", \"apkUrl\": \"https://github.com/${{ github.repository }}/releases/latest/download/CarLauncher-arm64.apk\"}" > version.json
          echo "{\"versionCode\": ${VERSION_CODE}, \"versionName\": \"${VERSION_NAME_32}\", \"apkUrl\": \"https://github.com/${{ github.repository }}/releases/latest/download/CarLauncher-32bit.apk\"}" > version-32bit.json

      - name: Compile 64-Bit (arm64)
        shell: bash
        working-directory: android
        run: |
          ./gradlew -Parm64 -PautoVersionCode="${VERSION_CODE}" -PautoVersionName="${VERSION_NAME_64}" assembleCarlauncherDebug -q
          APK_PATH=$(find app/build/outputs/apk -name "*debug.apk" | head -n 1)
          cp "$APK_PATH" CarLauncher-arm64.apk

      - name: Clean C++ and Build Cache for 32-Bit
        shell: bash
        working-directory: android
        run: |
          rm -rf app/build sdk/build app/.cxx sdk/.cxx

      - name: Compile 32-Bit (arm32)
        shell: bash
        working-directory: android
        run: |
          ./gradlew -Parm32 -PautoVersionCode="${VERSION_CODE}" -PautoVersionName="${VERSION_NAME_32}" assembleCarlauncherDebug -q
          APK_PATH=$(find app/build/outputs/apk -name "*debug.apk" | head -n 1)
          cp "$APK_PATH" CarLauncher-32bit.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarLauncher-APKs
          path: |
            android/CarLauncher-arm64.apk
            android/CarLauncher-32bit.apk
            android/version.json
            android/version-32bit.json

      - name: Publish Release with GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd android
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git tag -f latest
          git push origin latest --force

          RELEASE_NOTES="### 🚀 Güncel Derleme Bilgileri
          - **Versiyon (64-Bit):** ${{ env.VERSION_NAME_64 }}
          - **Versiyon (32-Bit):** ${{ env.VERSION_NAME_32 }}
          - **İşlem (SHA):** ${{ github.sha }}
          
          *Bu sürüm her başarılı derleme sonrası otomatik olarak güncellenir.*"

          if gh release view latest >/dev/null 2>&1; then
            echo "Mevcut 'latest' release guncelleniyor..."
            gh release edit latest --title "Latest CarLauncher Build" --notes "$RELEASE_NOTES"
            gh release upload latest CarLauncher-arm64.apk CarLauncher-32bit.apk version.json version-32bit.json --clobber
          else
            echo "Yeni 'latest' release olusturuluyor..."
            gh release create latest \
              --title "Latest CarLauncher Build" \
              --notes "$RELEASE_NOTES" \
              CarLauncher-arm64.apk \
              CarLauncher-32bit.apk \
              version.json \
              version-32bit.json
          fi
